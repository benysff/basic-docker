# İndirilebilir paketler: macOS (Apple Silicon ve Intel) ve Windows (deneysel).
#  - PR'larda: paketler derlenir ve denenir (Actions sayfasında "Artifacts" olarak indirilebilir).
#  - v ile başlayan bir etiket atılınca (ör. v2.1.0): paketler o sürümün Release sayfasına eklenir.
#    Sürüm notu .github/SURUM_NOTLARI.md dosyasından alınır.
name: Sürüm paketleri

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "**.py"
      - "static/**"
      - "assets/**"
      - "requirements.txt"
      - "basic-docker.spec"
      - ".github/workflows/surum.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derle:
    name: ${{ matrix.ad }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # Windows konsolu cp1252; Türkçe çıktı yazarken hata vermesin
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: macOS (Apple Silicon)
            os: macos-15
            dosya: Basic-Docker-macOS-AppleSilicon.zip
          - ad: macOS (Intel)
            os: macos-15-intel
            dosya: Basic-Docker-macOS-Intel.zip
          - ad: Windows (deneysel)
            os: windows-latest
            dosya: Basic-Docker-Windows-Kurulum.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekenleri kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Windows terminali (ConPTY) çalışıyor mu?
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, time
          from winpty import PtyProcess
          p = PtyProcess.spawn(["cmd", "/c", "echo merhaba-terminal"], dimensions=(24, 80), env=dict(os.environ))
          p.setwinsize(30, 100)
          out, end = "", time.time() + 15
          while time.time() < end and "merhaba-terminal" not in out:
              try:
                  out += p.read(4096)
              except EOFError:
                  break
          while p.isalive() and time.time() < end:
              time.sleep(0.2)
          print(repr(out[-200:]), "çıkış:", p.exitstatus)
          assert "merhaba-terminal" in out, "terminal çıktısı okunamadı"

      - name: Windows'a özel işlevler çalışıyor mu?
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, subprocess, tempfile
          import docker_service as ds, backups as bk, resources as rs, app
          assert ds.here("te") == "bu bilgisayarda" and ds.here_en() == "this computer", "Windows'ta 'bu bilgisayar' denmeli"
          # Yedek silme: Geri Dönüşüm Kutusu'na (geri alınabilir)
          d = tempfile.mkdtemp(); f = os.path.join(d, "deneme.txt")
          open(f, "w").write("x")
          assert bk._recycle_windows(f) and not os.path.exists(f), "Geri Dönüşüm Kutusu'na taşınamadı"
          # Kapı haritası: netstat + tasklist
          ports = rs._listening_windows()
          print("dinlenen kapılar:", {p: v[0]["proc"] for p, v in sorted(ports.items())[:8]})
          assert ports, "dinlenen kapı okunamadı"
          print("motor:", ds.engine_kind())
          # Pano (Actions makinesinde masaüstü oturumu olmayabilir; olmazsa sadece uyar)
          try:
              print("pano:", app.api_copy({"metin": "Türkçe ğüşiöç"}))
          except Exception as e:
              print("uyarı: pano denenemedi:", e)

      - name: Paketle
        run: pyinstaller --noconfirm basic-docker.spec

      - name: Paketi dene (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/Basic Docker.app/Contents/MacOS/Basic Docker" --kendini-dene deneme.json
          cat deneme.json
          ditto -c -k --keepParent "dist/Basic Docker.app" "${{ matrix.dosya }}"

      - name: Paketi dene (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Basic Docker/Basic Docker.exe" -ArgumentList "--kendini-dene", "$PWD\deneme.json" -Wait -PassThru
          Get-Content deneme.json
          if ($p.ExitCode -ne 0) { throw "Paket denemesi başarısız (çıkış kodu $($p.ExitCode))" }

      - name: Kurulum dosyası (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $surum = (Select-String -Path app.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$surum" "packaging\windows-kurulum.iss"
          if ($LASTEXITCODE -ne 0) { throw "Kurulum dosyası üretilemedi" }
          Copy-Item "dist\Basic-Docker-Windows-Kurulum.exe" "${{ matrix.dosya }}"

      - name: Kurulumu dene (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Sessiz kur → AppData'daki kopyayı dene → Başlat menüsü kısayolu var mı → kaldır
          $k = Start-Process -FilePath "${{ matrix.dosya }}" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$PWD\kurulum.log" -Wait -PassThru
          if ($k.ExitCode -ne 0) { Get-Content kurulum.log -Tail 40; throw "Kurulum başarısız (çıkış kodu $($k.ExitCode))" }
          $klasor = Join-Path $env:LOCALAPPDATA "Programs\Basic Docker"
          $exe = Join-Path $klasor "Basic Docker.exe"
          if (-not (Test-Path $exe)) { throw "Kurulum yerinde uygulama yok: $exe" }
          $t = Start-Process -FilePath $exe -ArgumentList "--kendini-dene", "$PWD\kurulu.json" -Wait -PassThru
          Get-Content kurulu.json
          if ($t.ExitCode -ne 0) { throw "Kurulu uygulamanın denemesi başarısız" }
          $kisayol = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Basic Docker.lnk"
          if (-not (Test-Path $kisayol)) { throw "Başlat menüsü kısayolu yok" }
          Start-Process -FilePath (Join-Path $klasor "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw "Kaldırma sonrası uygulama hâlâ duruyor" }
          if (Test-Path $kisayol) { throw "Kaldırma sonrası kısayol hâlâ duruyor" }
          "Kurulum, deneme ve kaldırma tamam."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dosya }}
          path: ${{ matrix.dosya }}
          if-no-files-found: error

  yayinla:
    name: Release'e ekle
    needs: derle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # sadece bu iş Release'e yazabilir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: paketler
          merge-multiple: true
      - name: Release oluştur ya da güncelle
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ github.ref_name }}
        run: |
          ls -la paketler
          if gh release view "$ETIKET" >/dev/null 2>&1; then
            gh release upload "$ETIKET" paketler/* --clobber
          else
            gh release create "$ETIKET" paketler/* --verify-tag --title "Basic Docker $ETIKET" --notes-file .github/SURUM_NOTLARI.md
          fi
